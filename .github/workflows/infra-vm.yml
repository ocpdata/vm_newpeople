name: infra-vm

on:
  workflow_dispatch:
    inputs:
      app_repository:
        description: Repository to deploy
        required: true
        default: ocpdata/newpeople
        type: string
      app_ref:
        description: Git ref from ocpdata/newpeople to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_public_subnet_cidr: ${{ vars.PUBLIC_SUBNET_CIDR }}
      TF_VAR_private_subnet_1_cidr: ${{ vars.PRIVATE_SUBNET_1_CIDR }}
      TF_VAR_private_subnet_2_cidr: ${{ vars.PRIVATE_SUBNET_2_CIDR }}
      TF_VAR_db_instance_class: ${{ vars.DB_INSTANCE_CLASS }}
      TF_VAR_db_allocated_storage: ${{ vars.DB_ALLOCATED_STORAGE }}
      TF_VAR_db_engine_version: ${{ vars.DB_ENGINE_VERSION }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_port: ${{ vars.DB_PORT }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_multi_az: ${{ vars.DB_MULTI_AZ }}
      TF_VAR_db_publicly_accessible: ${{ vars.DB_PUBLICLY_ACCESSIBLE }}
      TF_VAR_db_deletion_protection: ${{ vars.DB_DELETION_PROTECTION }}
      TF_VAR_db_skip_final_snapshot: ${{ vars.DB_SKIP_FINAL_SNAPSHOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Derive SSH public key from PEM
        env:
          SSH_KEY_PEM: ${{ secrets.SSH_KEY_PEM }}
        run: |
          if [[ -z "${SSH_KEY_PEM:-}" ]]; then
            echo "::error::Missing required secret SSH_KEY_PEM." >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/newpeople.pem"
          umask 077
          printf '%s\n' "$SSH_KEY_PEM" > "$key_file"
          public_key="$(ssh-keygen -y -f "$key_file")"
          echo "TF_VAR_ssh_public_key=${public_key}" >> "$GITHUB_ENV"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          cat > backend.remote.tfbackend <<EOF
          organization = "${{ vars.TFC_ORG }}"
          workspaces { name = "${{ vars.TFC_WORKSPACE }}" }
          EOF
          terraform init \
            -input=false \
            -backend-config=backend.remote.tfbackend

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_public_subnet_cidr: ${{ vars.PUBLIC_SUBNET_CIDR }}
      TF_VAR_private_subnet_1_cidr: ${{ vars.PRIVATE_SUBNET_1_CIDR }}
      TF_VAR_private_subnet_2_cidr: ${{ vars.PRIVATE_SUBNET_2_CIDR }}
      TF_VAR_db_instance_class: ${{ vars.DB_INSTANCE_CLASS }}
      TF_VAR_db_allocated_storage: ${{ vars.DB_ALLOCATED_STORAGE }}
      TF_VAR_db_engine_version: ${{ vars.DB_ENGINE_VERSION }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_port: ${{ vars.DB_PORT }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_multi_az: ${{ vars.DB_MULTI_AZ }}
      TF_VAR_db_publicly_accessible: ${{ vars.DB_PUBLICLY_ACCESSIBLE }}
      TF_VAR_db_deletion_protection: ${{ vars.DB_DELETION_PROTECTION }}
      TF_VAR_db_skip_final_snapshot: ${{ vars.DB_SKIP_FINAL_SNAPSHOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform init
        run: |
          cat > backend.remote.tfbackend <<EOF
          organization = "${{ vars.TFC_ORG }}"
          workspaces { name = "${{ vars.TFC_WORKSPACE }}" }
          EOF
          terraform init \
            -input=false \
            -backend-config=backend.remote.tfbackend

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show public IP
        run: terraform output -raw public_ip

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_public_subnet_cidr: ${{ vars.PUBLIC_SUBNET_CIDR }}
      TF_VAR_private_subnet_1_cidr: ${{ vars.PRIVATE_SUBNET_1_CIDR }}
      TF_VAR_private_subnet_2_cidr: ${{ vars.PRIVATE_SUBNET_2_CIDR }}
      TF_VAR_db_instance_class: ${{ vars.DB_INSTANCE_CLASS }}
      TF_VAR_db_allocated_storage: ${{ vars.DB_ALLOCATED_STORAGE }}
      TF_VAR_db_engine_version: ${{ vars.DB_ENGINE_VERSION }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_port: ${{ vars.DB_PORT }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_db_multi_az: ${{ vars.DB_MULTI_AZ }}
      TF_VAR_db_publicly_accessible: ${{ vars.DB_PUBLICLY_ACCESSIBLE }}
      TF_VAR_db_deletion_protection: ${{ vars.DB_DELETION_PROTECTION }}
      TF_VAR_db_skip_final_snapshot: ${{ vars.DB_SKIP_FINAL_SNAPSHOT }}
      PORT: ${{ vars.PORT }}
      TZ: America/Mexico_City
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
      APP_INVITE_SETUP_URL: ${{ vars.APP_INVITE_SETUP_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_ENABLE_WEB_SEARCH: ${{ vars.OPENAI_ENABLE_WEB_SEARCH }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOCUMENT_STORAGE_PROVIDER: ${{ vars.DOCUMENT_STORAGE_PROVIDER }}
      DOCUMENT_STORAGE_S3_BUCKET: ${{ vars.DOCUMENT_STORAGE_S3_BUCKET }}
      DOCUMENT_STORAGE_S3_REGION: ${{ vars.DOCUMENT_STORAGE_S3_REGION }}
      DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE: ${{ vars.DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE }}
      DOCUMENT_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.DOCUMENT_STORAGE_S3_ACCESS_KEY_ID }}
      DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      AUTH_GOOGLE_ENABLED: ${{ vars.AUTH_GOOGLE_ENABLED }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      WAF_LOGIN_EMAIL: ${{ vars.WAF_LOGIN_EMAIL }}
      WAF_LOGIN_PASSWORD: ${{ secrets.WAF_LOGIN_PASSWORD }}
      XC_API_URL: ${{ vars.XC_API_URL }}
      XC_API_P12_FILE: ${{ vars.XC_API_P12_FILE }}
      XC_P12_PASSWORD: ${{ secrets.XC_P12_PASSWORD }}
      XC_NAMESPACE: ${{ vars.XC_NAMESPACE }}
      XC_LB_NAME: ${{ vars.XC_LB_NAME }}
      XC_WAF_MODE: ${{ vars.XC_WAF_MODE }}
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_ref }}
          path: app-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Install application dependencies
        working-directory: app-source
        run: npm install

      - name: Build web application
        working-directory: app-source
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build:web

      - name: Package application release
        run: |
          install -m 0755 infra/scripts/bootstrap_schema_manual.sh app-source/scripts/bootstrap_schema_manual.sh
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='apps/web/node_modules' \
            -czf newpeople-release.tgz \
            -C app-source .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve VM and DB connection data from Terraform state
        working-directory: infra/terraform
        run: |
          cat > backend.remote.tfbackend <<EOF
          organization = "${{ vars.TFC_ORG }}"
          workspaces { name = "${{ vars.TFC_WORKSPACE }}" }
          EOF
          terraform init \
            -input=false \
            -backend-config=backend.remote.tfbackend
          host="$(terraform output -raw public_ip)"
          db_host="$(terraform output -raw db_host)"

          if [[ -z "${host}" ]]; then
            echo "::error::Terraform output 'public_ip' is empty. Cannot continue deploy without VM_HOST." >&2
            terraform output || true
            exit 1
          fi

          if [[ -z "${db_host}" ]]; then
            echo "::error::Terraform output 'db_host' is empty. Cannot continue deploy without DB_HOST." >&2
            terraform output || true
            exit 1
          fi

          echo "VM_HOST=${host}" >> "$GITHUB_ENV"
          echo "DB_HOST=${db_host}" >> "$GITHUB_ENV"

      - name: Render runtime environment file
        working-directory: infra
        run: |
          chmod +x scripts/render_runtime_env.sh
          scripts/render_runtime_env.sh "$RUNNER_TEMP/newpeople-api.env"

      - name: Configure SSH key
        env:
          SSH_KEY_PEM: ${{ secrets.SSH_KEY_PEM }}
        run: |
          if [[ -z "${VM_HOST:-}" ]]; then
            echo "::error::VM_HOST is empty. Terraform did not return a valid public IP." >&2
            exit 1
          fi

          if [[ -z "${SSH_KEY_PEM:-}" ]]; then
            echo "::error::Missing required secret SSH_KEY_PEM." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY_PEM}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Wait for deployer SSH access
        run: |
          for attempt in {1..24}; do
            if ssh \
              -i ~/.ssh/id_rsa \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 \
              deployer@"$VM_HOST" "echo ready"; then
              exit 0
            fi
            echo "Waiting for cloud-init to finish and enable deployer SSH access..."
            sleep 10
          done
          echo "Timed out waiting for deployer SSH access" >&2
          exit 1

      - name: Copy release and scripts to VM
        run: |
          release_id="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "RELEASE_ID=${release_id}" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_rsa -o IdentitiesOnly=yes newpeople-release.tgz deployer@"$VM_HOST":/tmp/newpeople-release.tgz
          scp -i ~/.ssh/id_rsa -o IdentitiesOnly=yes "$RUNNER_TEMP/newpeople-api.env" deployer@"$VM_HOST":/tmp/newpeople-api.env
          scp -i ~/.ssh/id_rsa -o IdentitiesOnly=yes infra/scripts/deploy_remote.sh deployer@"$VM_HOST":/tmp/deploy_remote.sh

      - name: Run remote deployment
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes deployer@"$VM_HOST" \
            "chmod +x /tmp/deploy_remote.sh && /tmp/deploy_remote.sh /tmp/newpeople-release.tgz /tmp/newpeople-api.env $RELEASE_ID"

      - name: Verify API timezone in VM
        run: |
          service_tz="$(ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes deployer@"$VM_HOST" \
            "set -euo pipefail; pid=\$(sudo systemctl show -p MainPID --value newpeople-api); sudo tr '\\0' '\\n' < /proc/\"\$pid\"/environ | grep '^TZ=' | cut -d= -f2")"

          command_tz="$(ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes deployer@"$VM_HOST" \
            "set -euo pipefail; sudo bash -lc 'set -euo pipefail; set -a; source /var/app/newpeople/shared/config/api.env; set +a; node -e \"console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)\"'")"

          echo "Service TZ: ${service_tz}"
          echo "Node command TZ: ${command_tz}"

          if [[ "${service_tz}" != "America/Mexico_City" ]]; then
            echo "::error::newpeople-api service TZ is '${service_tz}', expected 'America/Mexico_City'." >&2
            exit 1
          fi

          if [[ "${command_tz}" != "America/Mexico_City" ]]; then
            echo "::error::node timezone output is '${command_tz}', expected 'America/Mexico_City'." >&2
            exit 1
          fi

      - name: Validate healthcheck
        run: |
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          for attempt in {1..12}; do
            http_code="$({
              curl \
                --silent \
                --show-error \
                --output "$body_file" \
                --write-out '%{http_code}' \
                "http://$VM_HOST/health"
            } || true)"

            if [[ "$http_code" == "200" ]]; then
              cat "$body_file"
              exit 0
            fi

            echo "External healthcheck attempt ${attempt}/12 returned HTTP ${http_code:-curl-error}" >&2
            if [[ -s "$body_file" ]]; then
              echo "Response body:" >&2
              cat "$body_file" >&2
            fi
            sleep 5
          done
          exit 1

      - name: Collect remote diagnostics on failure
        if: failure()
        env:
          SSH_KEY_PEM: ${{ secrets.SSH_KEY_PEM }}
        run: |
          if [[ -z "${VM_HOST:-}" ]]; then
            echo "Skipping remote diagnostics: VM_HOST is empty (earlier step likely failed before host resolution)."
            exit 0
          fi

          if [[ ! -f ~/.ssh/id_rsa ]]; then
            if [[ -z "${SSH_KEY_PEM:-}" ]]; then
              echo "Skipping remote diagnostics: SSH private key is unavailable in this step."
              exit 0
            fi
            mkdir -p ~/.ssh
            printf '%s\n' "${SSH_KEY_PEM}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 deployer@"$VM_HOST" '
            echo "===== systemctl status ====="
            sudo systemctl status newpeople-api --no-pager || true
            echo "===== journalctl ====="
            sudo journalctl -u newpeople-api -n 200 --no-pager || true
            echo "===== nginx error log ====="
            sudo tail -n 200 /var/log/nginx/error.log || true
            echo "===== api env keys ====="
            sudo sed -E "s/=.*/=<redacted>/" /var/app/newpeople/shared/config/api.env || true
          ' || true
