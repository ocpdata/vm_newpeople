name: infra-vm

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Git ref from ocpdata/newpeople to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_subnet_id: ${{ vars.SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -backend-config="organization=${{ vars.TFC_ORG }}" \
            -backend-config="workspaces.name=${{ vars.TFC_WORKSPACE }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_subnet_id: ${{ vars.SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -backend-config="organization=${{ vars.TFC_ORG }}" \
            -backend-config="workspaces.name=${{ vars.TFC_WORKSPACE }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show public IP
        run: terraform output -raw public_ip

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_vpc_id: ${{ vars.VPC_ID }}
      TF_VAR_subnet_id: ${{ vars.SUBNET_ID }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      PORT: ${{ vars.PORT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
      APP_INVITE_SETUP_URL: ${{ vars.APP_INVITE_SETUP_URL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_ENABLE_WEB_SEARCH: ${{ vars.OPENAI_ENABLE_WEB_SEARCH }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DOCUMENT_STORAGE_PROVIDER: ${{ vars.DOCUMENT_STORAGE_PROVIDER }}
      DOCUMENT_STORAGE_S3_BUCKET: ${{ vars.DOCUMENT_STORAGE_S3_BUCKET }}
      DOCUMENT_STORAGE_S3_REGION: ${{ vars.DOCUMENT_STORAGE_S3_REGION }}
      DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE: ${{ vars.DOCUMENT_STORAGE_S3_FORCE_PATH_STYLE }}
      DOCUMENT_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.DOCUMENT_STORAGE_S3_ACCESS_KEY_ID }}
      DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          repository: ocpdata/newpeople
          ref: ${{ inputs.app_ref }}
          path: app-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Install application dependencies
        working-directory: app-source
        run: npm install

      - name: Build web application
        working-directory: app-source
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build:web

      - name: Package application release
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='apps/web/node_modules' \
            -czf newpeople-release.tgz \
            -C app-source .

      - name: Render runtime environment file
        working-directory: infra
        run: |
          chmod +x scripts/render_runtime_env.sh
          scripts/render_runtime_env.sh "$RUNNER_TEMP/newpeople-api.env"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Resolve VM public IP from Terraform state
        working-directory: infra/terraform
        run: |
          terraform init \
            -input=false \
            -backend-config="organization=${{ vars.TFC_ORG }}" \
            -backend-config="workspaces.name=${{ vars.TFC_WORKSPACE }}"
          host="$(terraform output -raw public_ip)"
          echo "VM_HOST=${host}" >> "$GITHUB_ENV"

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Copy release and scripts to VM
        run: |
          release_id="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "RELEASE_ID=${release_id}" >> "$GITHUB_ENV"
          scp -i ~/.ssh/id_rsa newpeople-release.tgz deployer@"$VM_HOST":/tmp/newpeople-release.tgz
          scp -i ~/.ssh/id_rsa "$RUNNER_TEMP/newpeople-api.env" deployer@"$VM_HOST":/tmp/newpeople-api.env
          scp -i ~/.ssh/id_rsa infra/scripts/deploy_remote.sh deployer@"$VM_HOST":/tmp/deploy_remote.sh

      - name: Run remote deployment
        run: |
          ssh -i ~/.ssh/id_rsa deployer@"$VM_HOST" \
            "chmod +x /tmp/deploy_remote.sh && /tmp/deploy_remote.sh /tmp/newpeople-release.tgz /tmp/newpeople-api.env $RELEASE_ID"

      - name: Validate healthcheck
        run: |
          for attempt in {1..12}; do
            if curl --fail --show-error --silent "http://$VM_HOST/health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
